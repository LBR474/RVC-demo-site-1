<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>RVC Demo Site</title>
    <style>
        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, 'Helvetica Neue', Arial;
            line-height: 1.5;
            margin: 0;
            padding: 0;
            background: #f7f7fb;
            color: #111
        }

        header {
            background: #0b67ff;
            color: #fff;


        }

        header img {
            display: block;
            width: 100%;
        }

        main.container {
            display: grid;
            grid-template-columns: 30% 70%;
            gap: 0px;
        }

        .left-column {
            background: #eee;
            padding: 0px;
        }

        .right-column {
            background: #fff;
            padding: 0px;
        }

        .demo-banner {
            position: fixed;
            top: 45%;
            left: -15%;
            width: 50%;
            background: orange;
            color: blue;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            padding: 12px 0;
            transform: rotate(-45deg);
            z-index: 9999;
        }

        footer {
            color: #666;
            font-size: 13px;
            text-align: center;
            padding: 24px
        }
    </style>
</head>

<body>
    
    <header>
        <img src="images/top-bar-top-main-image-desktop-1.jpg" alt="RVC Logo" style="width: 100%; ">
        <img src="images/second-top-bar-main-image-desktop-1.jpg" alt="RVC Logo" style="width: 100%; ">
        <img src="images/third-top-bar-main-image-desktop-1.jpg" alt="RVC Logo" style="width: 100%; ">
    </header>

    <main class="container">
        <div class="left-column">

        <div class="right-column">
            <img src="images/Right-column-in-main-top-1.jpg" alt="Right Column Image" style="width: 100%; ">
            <img src="images/Right-column-in-main-second-top-1.jpg" alt="Right Column Image" style="width: 100%; ">
            <img src="images/Right-column-in-main-third-top-1.jpg" alt="Right Column Image" style="width: 100%; ">
            <img src="images/Casino 1.svg" alt="Right Column Image" style="width: 100%; ">

    </main>

    <footer>
        <div class="container">© RVC Demo — Built locally</div>

</html>
