<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>RVC Demo Site</title>
	<style>
		body {
			font-family: system-ui, -apple-system, Segoe UI, Roboto, 'Helvetica Neue', Arial;
			line-height: 1.5;
			margin: 0;
			padding: 0;
			background: #f7f7fb;
			color: #111
		}

		header {
			/* background: #0b67ff; */
			color: #fff;


		}

		header img {
			display: block;
			width: 100%;
		}

		main.container {
			display: grid;
			grid-template-columns: 50% 50%;
			gap: 0px;
		}

		.left-column {
			background: #fff;
			padding: 10px;
			
			
		}
		.left-column img {
			border-top: 1px solid rgb(255, 255, 255);
		}

		.right-column {
			background: #fff;
			padding: 10px;
			
			
		}
		.right-column img {
			border-top: 1px solid rgb(254, 254, 254);
		}

		

		footer {
			color: #666;
			font-size: 13px;
			text-align: center;
			padding: 24px
		}
	</style>
</head>

<body>
	<header>
		<img src="images/top-bar-top-main-image-desktop-1.jpg" alt="RVC Logo" style="width: 100%; ">
		
	</header>

	<main class="container">
		<div class="left-column">
			
			<img src="images/compare images/Upgraded-Casino-map-2.jpeg" alt="Left Column Image" style="width: 100%; ">
			<img src="images/compare images/JPG-EH-Woodburn-BW-and-Coraki.jpg" alt="Left Column Image" style="width: 100%; "> ">
		</div>

		<div class="right-column">
			
			<img src="images/compare images/Original-Casino-map-1.jpg" alt="Right Column Image" style="width: 100%; ">

			
			
			<img src="images/compare images/original-EH-BW-WB-map-1.jpg" alt="Right Column Image" style="width: 100%; ">
		</div>
	</main>

	<footer>
		<div class="container">© RVC Demo — Built locally</div>
	</footer>
</body>

</html>
